apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "netra-core.fullname" . }}
  labels:
    app: netra-core
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: netra-core
  template:
    metadata:
      labels:
        app: netra-core
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
