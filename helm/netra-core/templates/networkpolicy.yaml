{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-netra-core
  namespace: {{ .Release.Namespace }}
  labels:
    app: netra-core
spec:
  podSelector:
    matchLabels:
      app: netra-core
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8000
          protocol: TCP
      {{- with .Values.networkPolicy.allowFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    # DNS + HTTPS (threat feeds, OTLP) + Redis/Postgres inside the cluster.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
    - ports:
        - port: 443
          protocol: TCP
        - port: 6379
          protocol: TCP
        - port: 5432
          protocol: TCP
{{- end }}
