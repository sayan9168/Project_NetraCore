<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Netra-Core | SOC Dashboard</title>
    <style>
        :root {
            --bg-dark: #0b0c10;
            --panel-bg: #1f2833;
            --accent-cyan: #66fcf1;
            --accent-red: #ff4b4b;
            --accent-yellow: #ffd700;
            --text-main: #c5c6c7;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-cyan);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        h1 { color: var(--accent-cyan); margin: 0; font-size: 1.5rem; }
        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .connected { background-color: #28a745; color: white; }
        .disconnected { background-color: var(--accent-red); color: white; }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex-grow: 1;
            overflow: hidden;
        }
        
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid #45a29e;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .panel h2 {
            margin-top: 0;
            color: var(--accent-cyan);
            border-bottom: 1px solid #45a29e;
            padding-bottom: 5px;
        }
        
        #alert-feed {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 10px;
        }
        
        .alert-card {
            background-color: rgba(255, 255, 255, 0.05);
            border-left: 5px solid var(--accent-red);
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            animation: fadeIn 0.5s;
        }
        .alert-card.high { border-left-color: var(--accent-yellow); }
        
        .alert-card h3 { margin: 0 0 5px 0; color: white; font-size: 1rem; }
        .alert-card p { margin: 2px 0; font-size: 0.85rem; }
        .severity-tag {
            font-weight: bold;
            color: black;
            background-color: var(--accent-red);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.75rem;
        }
        .severity-tag.high { background-color: var(--accent-yellow); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<header>
    <h1>🛡️ PROJECT NETRA-CORE // SOC COMMAND CENTER</h1>
    <div id="conn-status" class="status-badge disconnected">DISCONNECTED</div>
</header>

<div class="grid">
    <div class="panel">
        <h2>🚨 LIVE THREAT FEED (WebSocket)</h2>
        <div id="alert-feed">
            <p style="color: #666;">Waiting for incoming forensic events...</p>
        </div>
    </div>
    <div class="panel">
        <h2>📊 SYSTEM METRICS</h2>
        <p>Active Modules: <span style="color: var(--accent-cyan);">4 (A, B, C, D)</span></p>
        <p>Evidence Vault: <span style="color: var(--accent-cyan);">HMAC-SHA256 Secured</span></p>
        <p>Legal Engine: <span style="color: var(--accent-cyan);">FTS5 Active</span></p>
        <p>Total Alerts Received: <span id="alert-count" style="color: var(--accent-red);">0</span></p>
    </div>
</div>

<script>
    const feed = document.getElementById('alert-feed');
    const statusBadge = document.getElementById('conn-status');
    const alertCount = document.getElementById('alert-count');
    let count = 0;

    function connectWebSocket() {
        const ws = new WebSocket('ws://127.0.0.1:8000/ws/soc-dashboard');

        ws.onopen = () => {
            statusBadge.textContent = 'LIVE MONITORING';
            statusBadge.className = 'status-badge connected';
            feed.innerHTML = ''; // Clear waiting message
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.event_type === 'THREAT_DETECTED') {
                count++;
                alertCount.textContent = count;
                
                const card = document.createElement('div');
                card.className = `alert-card ${data.severity === 'HIGH' ? 'high' : ''}`;
                
                card.innerHTML = `
                    <h3>${data.title} <span class="severity-tag ${data.severity === 'HIGH' ? 'high' : ''}">${data.severity}</span></h3>
                    <p><strong>Module:</strong> ${data.module}</p>
                    <p><strong>Case ID:</strong> ${data.case_id}</p>
                    <p><strong>Time:</strong> ${new Date(data.timestamp).toLocaleTimeString()}</p>
                `;
                
                // Prepend new alerts to the top
                feed.prepend(card);
            }
        };

        ws.onclose = () => {
            statusBadge.textContent = 'DISCONNECTED';
            statusBadge.className = 'status-badge disconnected';
            // Auto-reconnect after 3 seconds
            setTimeout(connectWebSocket, 3000);
        };
        
        ws.onerror = () => ws.close();
    }

    connectWebSocket();
</script>

</body>
</html>
